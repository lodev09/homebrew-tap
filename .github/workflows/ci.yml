name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: Style + audit
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Style
        env:
          TAP: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew style "$TAP"

      - name: Audit
        env:
          TAP: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: brew audit --strict --online --tap="$TAP"
